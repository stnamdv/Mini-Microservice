version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - "22017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ecommerce_auth
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/ecommerce_auth
      JWT_SECRET: 89250bb2f79acf45e628c21a143e5e5b
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - ecommerce-network
    volumes:
      - ./auth-service:/app
      - /app/node_modules

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      NODE_ENV: production
      API_GATEWAY_URL: http://localhost:3000
    depends_on:
      - auth-service
    networks:
      - ecommerce-network
    volumes:
      - ./api-gateway:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  ecommerce-network:
    driver: bridge

